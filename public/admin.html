<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firmware portal</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d8dee4; --accent:#0969da; --bad:#cf222e; --ok:#1a7f37; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#58a6ff; --bad:#f85149; --ok:#3fb950; }
  }
  body { font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); max-width:720px; margin:24px auto; padding:0 16px; }
  h1 { font-size:20px; margin:0 0 16px; }
  h2 { font-size:15px; margin:28px 0 8px; }
  input, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.link { border:0; padding:0 4px; color:var(--accent); background:none; }
  button.link.danger { color:var(--bad); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  .row input[type=text], .row input[type=password] { flex:1; min-width:120px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  .tag { color:var(--ok); font-weight:600; }
  progress { width:100%; height:10px; }
  #msg { min-height:22px; margin:8px 0; }
  .err { color:var(--bad); } .good { color:var(--ok); }
  .muted { color:var(--muted); }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>

<h1>Firmware portal</h1>

<div class="row">
  <input id="token" type="password" placeholder="Admin token" autocomplete="off">
  <button id="load">Load</button>
</div>
<div id="msg"></div>

<h2>Versions</h2>
<div class="scroll"><table id="list"><tbody><tr><td class="muted">Enter token and press Load.</td></tr></tbody></table></div>

<h2>Upload</h2>
<div class="row">
  <input id="type" type="text" placeholder="Device type (esp32)" list="types" value="esp32">
  <datalist id="types"></datalist>
  <input id="version" type="text" placeholder="Version (1.0.8)">
</div>
<div class="row">
  <input id="notes" type="text" placeholder="Notes (optional)">
</div>
<div class="row">
  <input id="file" type="file" accept=".bin">
  <label><input id="stable" type="checkbox"> Set as stable</label>
</div>
<div class="row">
  <button id="upload" class="primary">Upload</button>
</div>
<progress id="bar" max="100" value="0" hidden></progress>

<script>
  const $ = (id) => document.getElementById(id);
  const API = '/admin/api/firmware';
  let maxSize = 0;

  const store = {
    get() { try { return sessionStorage.getItem('fwtoken') || ''; } catch (e) { return ''; } },
    set(v) { try { sessionStorage.setItem('fwtoken', v); } catch (e) { /* private mode */ } }
  };

  function say(text, cls) { const m = $('msg'); m.textContent = text || ''; m.className = cls || ''; }

  async function api(method, url) {
    const res = await fetch(url, { method, headers: { Authorization: 'Bearer ' + $('token').value.trim() } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  function cell(tr, text, title) {
    const td = document.createElement('td');
    td.textContent = text;
    if (title) td.title = title;
    tr.appendChild(td);
    return td;
  }

  function action(td, label, fn, danger) {
    const b = document.createElement('button');
    b.className = 'link' + (danger ? ' danger' : '');
    b.textContent = label;
    b.onclick = fn;
    td.appendChild(b);
  }

  async function load() {
    say('');
    try {
      const data = await api('GET', API);
      store.set($('token').value.trim());
      maxSize = data.maxSize;
      render(data.types);
    } catch (e) { say(e.message, 'err'); }
  }

  function render(types) {
    const body = $('list').querySelector('tbody');
    body.textContent = '';
    $('types').textContent = '';

    const names = Object.keys(types);
    if (!names.length) { body.innerHTML = '<tr><td class="muted">No firmware yet.</td></tr>'; return; }

    const head = document.createElement('tr');
    for (const h of ['Type', 'Version', 'Size', 'Uploaded', 'Notes', '']) { const th = document.createElement('th'); th.textContent = h; head.appendChild(th); }
    body.appendChild(head);

    for (const type of names) {
      const o = document.createElement('option'); o.value = type; $('types').appendChild(o);
      for (const v of types[type]) {
        const tr = document.createElement('tr');
        cell(tr, type);
        const vt = cell(tr, v.version);
        if (v.stable) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = ' stable'; vt.appendChild(s); }
        cell(tr, v.size ? (v.size / 1024).toFixed(0) + ' KB' : '-', v.sha256 ? 'sha256 ' + v.sha256 : '');
        cell(tr, v.uploadedAt ? new Date(v.uploadedAt).toLocaleDateString() : '-');
        cell(tr, v.notes || '');
        const act = cell(tr, '');
        if (!v.stable) {
          action(act, 'make stable', () => run('POST', `${API}/${type}/${v.version}/stable`));
          action(act, 'delete', () => confirm(`Delete ${type} ${v.version}?`) && run('DELETE', `${API}/${type}/${v.version}`), true);
        }
        body.appendChild(tr);
      }
    }
  }

  async function run(method, url) {
    try { await api(method, url); await load(); say('Done', 'good'); } catch (e) { say(e.message, 'err'); }
  }

  function upload() {
    const type = $('type').value.trim(), version = $('version').value.trim(), file = $('file').files[0];
    if (!type || !version || !file) return say('Type, version and file are required', 'err');
    if (maxSize && file.size > maxSize) return say(`File too large (max ${Math.round(maxSize / 1024)} KB)`, 'err');

    const url = `${API}/${encodeURIComponent(type)}/${encodeURIComponent(version)}` +
      `?notes=${encodeURIComponent($('notes').value)}&stable=${$('stable').checked ? 1 : 0}`;

    const xhr = new XMLHttpRequest();
    xhr.open('PUT', url);
    xhr.setRequestHeader('Authorization', 'Bearer ' + $('token').value.trim());
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');

    $('bar').hidden = false; $('bar').value = 0; $('upload').disabled = true; say('Uploading...');
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) $('bar').value = (e.loaded / e.total) * 100; };
    xhr.onerror = () => { $('upload').disabled = false; say('Network error', 'err'); };
    xhr.onload = () => {
      $('upload').disabled = false;
      let data = {}; try { data = JSON.parse(xhr.responseText); } catch (e) { /* not json */ }
      if (xhr.status === 201) {
        say(`Uploaded ${type} ${version}`, 'good');
        $('file').value = ''; $('version').value = ''; $('notes').value = '';
        load().then(() => say(`Uploaded ${type} ${version}`, 'good'));
      } else {
        say(data.error || `Upload failed (${xhr.status})`, 'err');
      }
    };
    xhr.send(file);
  }

  $('load').onclick = load;
  $('upload').onclick = upload;
  $('token').addEventListener('keydown', (e) => e.key === 'Enter' && load());
  $('token').value = store.get();
  if ($('token').value) load();
</script>
</body>
</html>
