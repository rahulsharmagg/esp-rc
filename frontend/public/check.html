<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firmware update</title>
<style>
  body{font-family:system-ui;margin:24px;max-width:480px}
  input,button{font-size:16px;padding:6px 10px}
  progress{width:100%;height:20px;margin:12px 0}
  #log{color:#666;font-size:14px}
</style>
<h3>Firmware update</h3>
<p>
  <input id="code" placeholder="Code" maxlength="8" style="text-transform:uppercase">
  <button id="go">Watch</button>
</p>
<progress id="bar" max="100" value="0"></progress>
<div id="info">-</div>
<div id="log"></div>

<script>
  const $ = (id) => document.getElementById(id);

  function watch(code) {
    const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    const ws = new WebSocket(proto + location.host + '/progress/' + encodeURIComponent(code));
    ws.onopen = () => $('log').textContent = 'connected';
    ws.onmessage = (e) => {
      const d = JSON.parse(e.data);
      if (d.type === 'error') { $('info').textContent = d.error; return; }
      $('bar').value = d.percent;
      $('info').textContent = d.status + ' ' + d.percent + '%' +
        (d.total ? ' (' + (d.sent / 1024).toFixed(0) + ' / ' + (d.total / 1024).toFixed(0) + ' KB)' : '') +
        (d.limit ? ' @' + d.limit + 'KB/s' : '');
    };
    ws.onclose = (e) => $('log').textContent = 'closed (' + e.code + ')';
  }

  $('go').onclick = () => $('code').value && watch($('code').value.trim());
  const preset = new URLSearchParams(location.search).get('code');
  if (preset) { $('code').value = preset; watch(preset); }
</script>
